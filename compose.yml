services:
  frontend:
    image: kubeecho:tools-test
    environment:
      SERVICE_TYPE: frontend
    ports:
      - "8081:8080"

  backend:
    image: kubeecho:tools-test
    environment:
      SERVICE_TYPE: backend
    ports:
      - "8082:8080"

  database:
    image: kubeecho:tools-test
    environment:
      SERVICE_TYPE: database
    ports:
      - "8083:8080"

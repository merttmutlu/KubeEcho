apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kube-echo
  name: kube-echo-fe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-echo
      tier: frontend
  strategy: {}
  template:
    metadata:
      labels:
        app: kube-echo
        tier: frontend
    spec:
      containers:
      - image: kubeecho:tools-test
        name: kubeecho
        env:
          - name: SERVICE_TYPE
            value: "frontend"
        ports:
          - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
